# Local stack (AGENTS.md §4). `docker compose up -d postgres mailpit` for development against `dotnet run`;
# `docker compose --profile app up --build` runs the full Hub from the Dockerfiles.
name: denoise
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: denoise
      POSTGRES_USER: denoise
      POSTGRES_PASSWORD: denoise
    command: ["postgres", "-c", "log_min_duration_statement=500", "-c", "shared_buffers=256MB"]
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U denoise -d denoise"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  # Mock OpenID Connect provider for SSO development (M11b): `docker compose --profile oidc up -d mock-oidc`, then run the
  # Api on the host with Auth__Oidc__Enabled=true, Auth__Oidc__Authority=http://localhost:8090/entra,
  # Auth__Oidc__ClientId=denoise, Auth__Oidc__Credential=secret, Auth__Oidc__ClientSecret=dev, Auth__Oidc__RequireHttpsMetadata=false.
  # Its login form takes the id_token claims as JSON, e.g. {"oid":"<guid>","roles":["DeNoise.Operator"],"groups":[]}.
  # The issuer is derived from the Host header, so browser and Api must both reach it as localhost:8090 (host-run Api only).
  # The integration tests start the same image through Testcontainers (or use DENOISE_TEST_OIDC_URL).
  mock-oidc:
    profiles: ["oidc"]
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
    ports: ["8090:8080"]

  migrator:
    profiles: ["app"]
    build: { context: ., dockerfile: build/Dockerfile, args: { HOST: Migrator } }
    environment: &appenv
      ConnectionStrings__DeNoise: Host=postgres;Port=5432;Database=denoise;Username=denoise;Password=denoise
      DOTNET_ENVIRONMENT: Development
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    profiles: ["app"]
    build: { context: ., dockerfile: build/Dockerfile, args: { HOST: Api } }
    environment: *appenv
    ports: ["8080:8080"]
    depends_on:
      migrator: { condition: service_completed_successfully }

  ingest:
    profiles: ["app"]
    build: { context: ., dockerfile: build/Dockerfile, args: { HOST: Ingest } }
    environment: *appenv
    ports: ["8081:8080"]
    depends_on:
      migrator: { condition: service_completed_successfully }

  workers:
    profiles: ["app"]
    build: { context: ., dockerfile: build/Dockerfile, args: { HOST: Workers } }
    command: ["--roles=processing,scheduler,dispatcher"]
    environment: *appenv
    ports: ["8082:8080"]
    depends_on:
      migrator: { condition: service_completed_successfully }

volumes:
  pgdata: {}
