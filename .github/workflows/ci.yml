name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CI: "true"

jobs:
  backend:
    name: Backend build, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore
      - name: Unit tests
        run: dotnet test --no-build -c Release --filter Category=Unit --logger "trx;LogFileName=unit.trx"
      - name: Integration tests
        env:
          ALERTHUB_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
        run: dotnet test --no-build -c Release --filter Category=Integration --logger "trx;LogFileName=integration.trx"
      - name: OpenAPI drift
        run: |
          dotnet tool install --global Microsoft.Extensions.ApiDescription.Server --version 10.0.* >/dev/null 2>&1 || true
          echo "OpenAPI document is validated by AlertHub.Contract.Tests; committed snapshot comparison lands with Milestone 4."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      matrix:
        host: [Api, Ingest, Workers, Migrator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.host }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          build-args: HOST=${{ matrix.host }}
          push: false
          tags: alerthub/${{ matrix.host }}:ci

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/alert-hub
      - run: helm template alert-hub deploy/helm/alert-hub --set postgres.connectionSecret=alerthub-db --set auth.local.bootstrapPasswordSecret=alerthub-admin >/dev/null
