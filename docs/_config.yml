title: DeNoise - Alert Management Platform
description: A sophisticated multi-tier alert management platform that deduplicates, auto-resolves, and intelligently routes alerts
theme: jekyll-theme-minimal
show_downloads: false

# GitHub Pages configuration
plugins:
  - jekyll-seo-tag
  - jekyll-feed

# Exclude files from GitHub Pages processing
exclude:
  - .gitignore
  - README.md

# Enable GitHub Flavored Markdown
markdown: kramdown

# Social links
social_links:
  github: gr4b4z/denoise

# Permalinks
permalink: /:path/

# Collections for documentation
collections:
  milestones:
    output: true
    permalink: /:collection/:path/
  runbooks:
    output: true
    permalink: /:collection/:path/
