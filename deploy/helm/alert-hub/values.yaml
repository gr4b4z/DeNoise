# Values that must exist per 03 §4. Everything marked "initial" is a placeholder until the baseline (C9) is measured.
image:
  repository: ghcr.io/softwareone/alert-hub
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

ingest:
  replicas: 2
  resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 512Mi } }
api:
  replicas: 2
  resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 768Mi } }
workers:
  replicas: 2
  roles: "processing,scheduler,dispatcher"
  resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 768Mi } }
migrator:
  resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 512Mi } }

postgres:
  # Secret with key `connectionString` (Npgsql format). Required.
  connectionSecret: ""

auth:
  local:
    # Secret with key `password`; seeds the bootstrap `admin` user with must_change_password=true. Never logged.
    bootstrapPasswordSecret: ""
    passwordMinLength: 12
    lockoutFailures: 10
    lockoutWindow: "00:15:00"
  oidc:
    enabled: false          # milestone 11b
    authority: ""
    clientId: ""
    clientSecretSecret: ""

smtp:
  host: ""
  port: 587
  from: "alert-hub@example.invalid"
  credentialsSecret: ""

externalDeadmanUrl: ""      # spec §13.7; pinged every minute by the scheduler (milestone 5)

retention:
  rawDays: 30
  normalisedClosedDays: 90
  episodeClosedMonths: 12
  deliveryAttemptDays: 30
  auditMonths: 12
  sessionExpiredDays: 7
  loginAttemptDays: 30
  batchSize: 5000          # rows per delete statement (05 §7)
  runAtUtcHour: 2          # daily run, UTC

limits:
  payloadBytes: 262144      # 256 KiB
  ingestRps: 10             # per integration, initial (600/min)
  apiPerMinutePerUser: 600  # application API, per authenticated user (06 §6)
  loginPerMinutePerIp: 10   # /auth/login, per source IP (06 §6)

otel:
  endpoint: ""              # OTLP gRPC/HTTP endpoint; empty disables the exporter

publicBaseUrl: "https://alert-hub.example.invalid"          # links in notifications
ingestPublicBaseUrl: "https://alerts.example.invalid"       # heartbeat URLs shown in the UI

health:
  outboxLagThreshold: "00:05:00"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  api: { host: "" }
  ingest: { host: "" }
  tls: []

podDisruptionBudget:
  minAvailable: 1

allowInsecureDestinations: false
